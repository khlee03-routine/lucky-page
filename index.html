<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책읽는 방주 행운의 페이지</title>
<link rel="icon" href="logo.png">
<style>
  /* 로고와 같은 둥근 고딕: 나눔스퀘어라운드
     ① PC에 설치된 글꼴 → ② fonts/ 폴더의 파일(오프라인용) → ③ 네이버 한글 웹폰트 서버 순으로 사용 */
  @font-face { font-family: "NanumSquareRound"; font-weight: 400; font-display: swap;
    src: local("NanumSquareRoundR"), local("NanumSquareRound"),
         url("fonts/NanumSquareRoundR.woff2") format("woff2"),
         url("https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundR.woff2") format("woff2"); }
  @font-face { font-family: "NanumSquareRound"; font-weight: 700; font-display: swap;
    src: local("NanumSquareRoundB"), local("NanumSquareRound Bold"),
         url("fonts/NanumSquareRoundB.woff2") format("woff2"),
         url("https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundB.woff2") format("woff2"); }
  @font-face { font-family: "NanumSquareRound"; font-weight: 800; font-display: swap;
    src: local("NanumSquareRoundEB"), local("NanumSquareRound ExtraBold"),
         url("fonts/NanumSquareRoundEB.woff2") format("woff2"),
         url("https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareRound/NanumSquareRoundEB.woff2") format("woff2"); }
  :root {
    --font: "NanumSquareRound", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    /* 책읽는 방주 로고 색상 */
    --blue: #3a6bcf;
    --blue-d: #2c55ad;
    --ring: #4560cc;
    --purple: #4f4589;
    --purple-d: #3a3268;
    --paper: #fffdf7;
    --paper-edge: #efe8d8;
    --bg: #f4f6fc;
    --text: #2b2950;
    --muted: #7a7aa0;
    --accent: #ffb703;
    --cell: min(44vh, 30vw);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(ellipse at 50% 0%, #ffffff 0%, transparent 60%),
      radial-gradient(circle at 0% 100%, rgba(79, 69, 137, .12), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(58, 107, 207, .14), transparent 45%),
      var(--bg);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6vh;
    user-select: none;
  }
  /* 은은한 도트 패턴 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background-image: radial-gradient(rgba(69, 96, 204, .10) 1.5px, transparent 1.6px);
    background-size: 28px 28px;
  }

  header { display: flex; align-items: center; gap: 2vw; padding: 0 16px; }
  .logo {
    height: clamp(52px, 10vh, 120px); aspect-ratio: 1; border-radius: 50%;
    box-shadow: 0 8px 24px rgba(69, 96, 204, .25);
    background: #fff;
  }
  h1 {
    font-size: clamp(24px, 4.8vh, 58px); font-weight: 800; letter-spacing: .04em;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .round {
    display: inline-block; margin-top: .6vh;
    font-size: clamp(13px, 2.2vh, 24px); font-weight: 700; color: var(--purple);
    background: rgba(79, 69, 137, .1); padding: .2em .8em; border-radius: 999px;
  }
  .round:empty { display: none; }

  /* ===== 펼친 책 슬롯 (SVG 일러스트) ===== */
  .book {
    position: relative;
    height: calc(var(--cell) / .68);
    aspect-ratio: 1000 / 640;
    margin-bottom: calc(var(--cell) * .12);
  }
  .book > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .book.win > svg { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow {
    from { filter: drop-shadow(0 0 0 rgba(255,183,3,0)); }
    to   { filter: drop-shadow(0 0 28px rgba(255,183,3,.85)); }
  }
  /* 페이지 위 숫자 영역 (SVG 좌표 기준 %) */
  .slot { position: absolute; top: 14.5%; height: 68%; width: 33%; }
  .slot.left { left: 12%; }
  .slot.right { right: 12%; }
  .reel {
    position: absolute; inset: 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 16%, #000 84%, transparent 100%);
  }
  .strip { will-change: transform; position: absolute; left: 0; right: 0; top: 0; }
  .strip div {
    height: var(--cell); display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--cell) * .82); font-weight: 800; line-height: 1;
    font-family: var(--font); /* 로고와 같은 둥근 서체, 숫자 높이 모두 동일 */
    font-variant-numeric: tabular-nums;
    padding-top: calc(var(--cell) * .1); /* 이 서체는 숫자가 줄 위쪽에 놓여 있어 페이지 중앙으로 내림 */
    color: var(--purple);
  }
  .reel.done .strip div { color: var(--blue); }
  /* 아직 공개되지 않은 페이지: ? 표시 */
  .qmark {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-family: var(--font); font-weight: 800; font-size: calc(var(--cell) * .7); line-height: 1;
    color: rgba(79, 69, 137, .2);
    animation: qpulse 1.8s ease-in-out infinite;
  }
  @keyframes qpulse { 50% { color: rgba(79, 69, 137, .35); scale: 1.04; } }
  .book.q0 #page0 .qmark, .book.q1 #page1 .qmark { display: flex; }
  .book.q0 #reel0, .book.q1 #reel1 { visibility: hidden; }
  .slot.done { animation: pop .4s ease-out; }
  @keyframes pop { 40% { scale: 1.06; } }

  .status {
    font-size: clamp(16px, 2.8vh, 32px); font-weight: 800; min-height: 1.4em; text-align: center;
    color: var(--purple); padding: 0 16px;
  }
  .status.big { color: var(--blue); font-size: clamp(22px, 4.2vh, 48px); }

  /* 버튼 */
  .actions { display: flex; gap: 14px; align-items: center; min-height: clamp(48px, 7.2vh, 78px); flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .btn {
    font: inherit; font-weight: 800; cursor: pointer; border: 0; color: #fff;
    font-size: clamp(15px, 2.2vh, 24px);
    padding: 0 clamp(20px, 2.4vw, 36px); height: clamp(40px, 5.4vh, 58px);
    border-radius: 999px; letter-spacing: .08em;
    background: linear-gradient(180deg, #5b8be6, var(--blue) 55%, var(--blue-d));
    box-shadow: 0 4px 0 #1f3f86, 0 8px 18px rgba(44,85,173,.35);
    transition: transform .08s, box-shadow .08s, filter .2s;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f3f86, 0 4px 10px rgba(44,85,173,.35); }
  .btn:disabled { filter: grayscale(.6) opacity(.6); cursor: default; animation: none; }
  .btn.draw { animation: breathe 1.6s ease-in-out infinite; font-size: clamp(18px, 2.9vh, 32px); height: clamp(48px, 7.2vh, 78px); padding: 0 clamp(28px, 4vw, 60px); }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  .btn.ok {
    background: linear-gradient(180deg, #7a6fc0, var(--purple) 55%, var(--purple-d));
    box-shadow: 0 4px 0 #2a2350, 0 8px 18px rgba(79,69,137,.35);
  }
  .btn.alt {
    color: var(--purple); background: #fff;
    box-shadow: 0 0 0 2px var(--purple) inset, 0 6px 14px rgba(79,69,137,.18);
  }
  .btn.alt:active { transform: translateY(3px); }
  .hidden { display: none !important; }

  /* 숨김 메뉴 버튼 */
  .menu-btn {
    position: fixed; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: rgba(79,69,137,.1); color: var(--purple); font-size: 22px; cursor: pointer;
    opacity: .15; transition: opacity .2s;
  }
  .menu-btn:hover, .menu-btn:focus-visible { opacity: 1; }

  /* 서랍 */
  .drawer-bg { position: fixed; inset: 0; background: rgba(30, 28, 70, .35); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw);
    background: #fff; box-shadow: -10px 0 40px rgba(0,0,0,.15);
    transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column; padding: 20px 16px; gap: 14px; user-select: text;
  }
  body.open .drawer { transform: none; }
  body.open .drawer-bg { opacity: 1; pointer-events: auto; }
  .drawer h2 { font-size: 18px; display: flex; justify-content: space-between; align-items: center; color: var(--purple); }
  .x { background: none; border: 0; color: var(--muted); font-size: 24px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; }
  .tab {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #dcdcec;
    background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer;
  }
  .tab.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .tab[data-tab=redraws].on { background: var(--purple); border-color: var(--purple); }
  .list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: #f4f6fc;
  }
  .row .no { color: var(--muted); font-size: 13px; }
  .row .num { font-size: 26px; font-weight: 900; color: var(--blue); font-variant-numeric: tabular-nums; }
  .row .t { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .settings { border-top: 1px solid #ececf4; padding-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
  .settings label { display: flex; align-items: center; gap: 8px; }
  .settings input[type=text] {
    flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #dcdcec; font: inherit; color: var(--text);
  }
  .small-btns { display: flex; gap: 8px; }
  .small-btns button {
    flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #dcdcec;
    background: #fff; color: var(--text); font: inherit; cursor: pointer;
  }
  .small-btns .danger { border-color: #e5484d; color: #e5484d; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }

  canvas#fx { position: fixed; inset: 0; pointer-events: none; }

  @media (max-width: 700px) {
    :root { --cell: min(30vh, 38vw); }
    header { flex-direction: column; gap: 8px; text-align: center; }
  }
</style>
</head>
<body>
  <header>
    <img class="logo" src="logo.png" alt="책읽는 방주">
    <div>
      <h1 id="title">행운의 페이지</h1>
      <div class="round" id="round"></div>
    </div>
  </header>

  <div class="book" id="book">
    <svg viewBox="0 0 1000 640" aria-hidden="true">
      <defs>
        <linearGradient id="gCover" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4f80e2"/><stop offset="1" stop-color="#2a50a3"/>
        </linearGradient>
        <!-- 왼쪽 페이지: 바깥은 밝고 책등 쪽으로 갈수록 휘어지며 어두워짐 -->
        <linearGradient id="gPageL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#efe7d2"/>
          <stop offset=".05" stop-color="#fbf7ec"/>
          <stop offset=".62" stop-color="#fdfaf2"/>
          <stop offset=".86" stop-color="#f1e9d6"/>
          <stop offset=".95" stop-color="#dccfb2"/>
          <stop offset="1" stop-color="#bfae8a"/>
        </linearGradient>
        <linearGradient id="gPageR" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#efe7d2"/>
          <stop offset=".05" stop-color="#fbf7ec"/>
          <stop offset=".62" stop-color="#fdfaf2"/>
          <stop offset=".86" stop-color="#f1e9d6"/>
          <stop offset=".95" stop-color="#dccfb2"/>
          <stop offset="1" stop-color="#bfae8a"/>
        </linearGradient>
        <linearGradient id="gGutter" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5a4320" stop-opacity="0"/>
          <stop offset=".5" stop-color="#5a4320" stop-opacity=".35"/>
          <stop offset="1" stop-color="#5a4320" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3a3268"/><stop offset=".5" stop-color="#6a5fb0"/><stop offset="1" stop-color="#3a3268"/>
        </linearGradient>
        <!-- 종이 질감 -->
        <filter id="fPaper" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .15  0 0 0 .055 0"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
        <filter id="fShadow" x="-10%" y="-50%" width="120%" height="200%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
        <path id="pL" d="M500,82 C430,46 250,36 54,50 L46,566 C250,554 430,560 500,594 Z"/>
        <path id="pR" d="M500,82 C570,46 750,36 946,50 L954,566 C750,554 570,560 500,594 Z"/>
        <clipPath id="cPages"><use href="#pL"/><use href="#pR"/></clipPath>
      </defs>

      <!-- 바닥 그림자 -->
      <ellipse cx="500" cy="612" rx="470" ry="20" fill="#1c2a5c" opacity=".35" filter="url(#fShadow)"/>

      <!-- 하드커버 -->
      <path d="M14,58 Q14,34 38,34 L962,34 Q986,34 986,58 L986,590 Q986,606 966,608 L530,612 Q500,626 470,612 L34,608 Q14,606 14,590 Z" fill="url(#gCover)"/>
      <path d="M14,58 Q14,34 38,34 L962,34 Q986,34 986,58" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>

      <!-- 아래에 겹친 페이지들 (책 두께) -->
      <g fill="#ebe2cb" stroke="#cfc2a2" stroke-width="1.2">
        <use href="#pL" transform="translate(-10 14)"/><use href="#pR" transform="translate(10 14)"/>
        <use href="#pL" transform="translate(-7.5 10.5)"/><use href="#pR" transform="translate(7.5 10.5)"/>
        <use href="#pL" transform="translate(-5 7)"/><use href="#pR" transform="translate(5 7)"/>
        <use href="#pL" transform="translate(-2.5 3.5)"/><use href="#pR" transform="translate(2.5 3.5)"/>
      </g>

      <!-- 펼친 두 페이지 -->
      <use href="#pL" fill="url(#gPageL)"/>
      <use href="#pR" fill="url(#gPageR)"/>
      <rect width="1000" height="640" fill="#fff" clip-path="url(#cPages)" filter="url(#fPaper)"/>
      <!-- 페이지 상단 휘어짐 하이라이트 -->
      <path d="M470,74 C400,46 250,40 60,52" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
      <path d="M530,74 C600,46 750,40 940,52" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
      <!-- 책등 골 -->
      <rect x="470" y="70" width="60" height="530" fill="url(#gGutter)" clip-path="url(#cPages)"/>
      <path d="M500,82 L500,594" stroke="#7a6440" stroke-opacity=".35" stroke-width="1.5"/>

      <!-- 머리말 / 쪽 표시 -->
      <g font-family="NanumSquareRound, 'Apple SD Gothic Neo', sans-serif" font-weight="700" fill="#a89a7a" text-anchor="middle">
        <text x="270" y="540" font-size="16" letter-spacing="2">— 십의 자리 —</text>
        <text x="730" y="540" font-size="16" letter-spacing="2">— 일의 자리 —</text>
      </g>

      <!-- 책갈피 끈 -->
      <path d="M492,588 L516,588 L516,688 L504,672 L492,688 Z" fill="url(#gRibbon)"/>
    </svg>
    <div class="slot left" id="page0"><div class="reel" id="reel0"><div class="strip"></div></div><div class="qmark">?</div></div>
    <div class="slot right" id="page1"><div class="reel" id="reel1"><div class="strip"></div></div><div class="qmark">?</div></div>
  </div>

  <div class="status" id="status">추첨 버튼을 눌러주세요</div>

  <div class="actions">
    <button class="btn draw" id="btnDraw">추 첨</button>
    <button class="btn draw hidden" id="btnNext">뒷자리 공개</button>
    <button class="btn ok hidden" id="btnConfirm">당첨 확정</button>
    <button class="btn alt hidden" id="btnRedraw">재추첨</button>
  </div>

  <canvas id="fx"></canvas>

  <!-- 보조 기능 (숨김) -->
  <button class="menu-btn" id="menuBtn" title="명단 / 설정 (L)" aria-label="명단 및 설정 열기">☰</button>
  <div class="drawer-bg" id="drawerBg"></div>
  <aside class="drawer" aria-label="명단 및 설정">
    <h2>추첨 기록 <button class="x" id="closeBtn" aria-label="닫기">×</button></h2>
    <div class="tabs">
      <button class="tab on" data-tab="winners">당첨 <span id="cntW">0</span></button>
      <button class="tab" data-tab="redraws">재추첨 <span id="cntR">0</span></button>
    </div>
    <div class="list" id="list"></div>
    <div class="settings">
      <label>제목 <input type="text" id="titleInput" maxlength="40"></label>
      <label><input type="checkbox" id="soundChk"> 효과음 <span class="hint" id="soundSrc"></span></label>
      <label>회전 시간 <input type="range" id="spinRange" min="3" max="12" step="1" style="flex:1"> <span id="spinLabel" class="hint"></span></label>
      <div class="small-btns">
        <button id="copyBtn">명단 복사</button>
        <button class="danger" id="resetBtn">전체 초기화</button>
      </div>
      <div class="hint">
        단축키: <b>Space</b> 추첨 / 뒷자리 공개 ·<b>L</b> 명단 열기/닫기 · <b>Esc</b> 닫기<br>
        남은 번호: <span id="remain"></span>개 · 데이터는 이 브라우저에만 저장되며 캐시(사이트 데이터) 삭제 시 초기화됩니다.
      </div>
    </div>
  </aside>

<script>
(() => {
  const KEY = 'lucky-draw-v1';
  const ALL = Array.from({ length: 99 }, (_, i) => i + 1);
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);

  // ---------- 저장소 ----------
  // stage: 1 = 앞자리 공개 후 뒷자리 대기, 2 = 두 자리 공개 후 확정/재추첨 대기
  const fresh = () => ({ title: '행운의 페이지', winners: [], redraws: [], pending: null, stage: null, sound: true, reelSec: 5 });
  const SECOND_RATIO = 1.2; // 뒷자리는 앞자리보다 20% 길게 돌아 긴장감 연출
  const reelMs = i => (S.reelSec || 5) * 1000 * (i ? SECOND_RATIO : 1);
  function load() {
    try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); }
    catch { return fresh(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
  let S = load();
  if (S.title === '행운권 추첨') { S.title = '행운의 페이지'; save(); } // 예전 기본 제목이 저장돼 있으면 새 제목으로

  const used = () => new Set([...S.winners, ...S.redraws].map(x => x.n).concat(S.pending ? [S.pending] : []));
  const remaining = () => ALL.filter(n => !used().has(n));

  // ================= 사운드 =================
  // 1) sounds/ 폴더에 파일이 있으면 그 파일을 재생
  // 2) 없으면 Web Audio로 실제 소리처럼 합성 (노이즈 기반 기계음/종소리/박수)
  const FILES = { spin: 'sounds/spin.mp3', stop: 'sounds/stop.mp3', win: 'sounds/win.mp3', confirm: 'sounds/confirm.mp3' };
  const audioFiles = {};
  for (const [k, src] of Object.entries(FILES)) {
    const a = new Audio();
    a.preload = 'auto';
    a.oncanplaythrough = () => { audioFiles[k] = a; updateSoundSrc(); };
    a.onerror = () => {};
    a.src = src;
  }
  function updateSoundSrc() {
    const n = Object.keys(audioFiles).length;
    $('soundSrc').textContent = n ? `(파일 ${n}개 사용 중)` : '(내장 합성음)';
  }
  function playFile(k, { loop = false, offset = 0 } = {}) {
    const a = audioFiles[k];
    if (!a || !S.sound) return null;
    const c = loop ? a : a.cloneNode();
    c.loop = loop; c.volume = 1; c.currentTime = offset; c.play().catch(() => {});
    return c;
  }

  let ac, noiseBuf;
  function ctx() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noise(t, dur, { type = 'bandpass', freq = 2000, q = 1, gain = .4, attack = .001, out } = {}) {
    const c = ctx();
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(out || c.destination);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + .05);
  }
  function tone(t, freq, dur, { type = 'sine', gain = .2, endFreq } = {}) {
    const c = ctx();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  const SFX = {
    // 릴이 한 칸 넘어갈 때: 짧은 '딸깍' (금속성 클릭 + 낮은 울림)
    tick() {
      const t = ctx().currentTime;
      noise(t, .028, { freq: 2600 + Math.random() * 900, q: 3, gain: .35 });
      noise(t, .05, { type: 'lowpass', freq: 500, gain: .25 });
    },
    // 릴이 멈출 때: 묵직한 '턱' + 종이 넘기는 소리
    stop() {
      if (playFile('stop')) return;
      const t = ctx().currentTime;
      noise(t, .18, { type: 'lowpass', freq: 380, gain: .9 });
      tone(t, 140, .18, { endFreq: 55, gain: .5 });
      noise(t + .02, .22, { freq: 3500, q: .6, gain: .12, attack: .03 }); // 종이 스침
    },
    // 당첨 번호 공개: 종소리 아르페지오 (비정수배 배음으로 실제 벨 질감)
    win() {
      if (playFile('win')) return;
      const t0 = ctx().currentTime;
      [1047, 1319, 1568, 2093].forEach((f, i) => {
        const t = t0 + i * .11;
        [[1, .22, 1.6], [2.76, .08, .9], [5.4, .04, .5], [8.9, .02, .3]].forEach(([r, g, d]) => tone(t, f * r, d, { gain: g }));
      });
    },
    // 당첨 확정: 박수갈채 (무작위 손뼉 수백 개)
    confirm() {
      if (playFile('confirm')) return;
      const c = ctx(), t0 = c.currentTime;
      const bus = c.createGain(); bus.connect(c.destination);
      bus.gain.setValueAtTime(1, t0); bus.gain.setValueAtTime(1, t0 + 2); bus.gain.linearRampToValueAtTime(.0001, t0 + 3.2);
      for (let i = 0; i < 420; i++) {
        const t = t0 + Math.pow(Math.random(), 1.4) * 3;
        noise(t, .02 + Math.random() * .04, { freq: 900 + Math.random() * 1800, q: 1.2, gain: .05 + Math.random() * .12, out: bus });
      }
    },
  };
  let spinLoop = null, lastTick = 0;
  // 책장 넘기는 소리(sounds/spin.mp3, 약 5초, 0.5~3초 구간이 가장 촘촘)
  // 회전이 길면 여러 번 겹쳐 재생해 끊김 없이 이어지게 하고,
  // 마지막 재생은 소리가 잦아드는 꼬리가 릴이 멈추는 시점에 맞도록 시작 시각을 잡음
  const SHUFFLE_TAIL = 4600, SHUFFLE_STEP = 2600;
  let spinTimers = [];
  function startSpinSound(totalMs) {
    if (!S.sound || !audioFiles.spin) return;
    spinLoop = [];
    const last = Math.max(0, totalMs - SHUFFLE_TAIL);
    const count = Math.ceil(last / SHUFFLE_STEP);
    const starts = Array.from({ length: count + 1 }, (_, i) => count ? last * i / count : 0);
    spinTimers = starts.map(t => setTimeout(() => {
      const a = playFile('spin', { offset: .15 });
      if (a && spinLoop) spinLoop.push(a);
    }, t));
  }
  function stopSpinSound() { // 마지막 자리가 멈추면 0.4초에 걸쳐 부드럽게 줄임
    spinTimers.forEach(clearTimeout); spinTimers = [];
    const list = spinLoop || []; spinLoop = null;
    for (const a of list) {
      const t0 = performance.now(), v0 = a.volume;
      const fade = () => {
        const k = 1 - (performance.now() - t0) / 400;
        if (k <= 0) { a.pause(); return; }
        a.volume = v0 * k; requestAnimationFrame(fade);
      };
      fade();
    }
  }
  function tickSound(slow = false) {
    // 책장 소리 재생 중에는 빠를 때 틱 생략, 느려지는 막판엔 숫자마다 딸깍
    if (!S.sound || (spinLoop && !slow)) return;
    const now = performance.now();
    if (now - lastTick < 38) return;  // 너무 빠르면 뭉개지지 않게 제한
    lastTick = now; SFX.tick();
  }
  const sfx = k => { if (S.sound) try { SFX[k](); } catch {} };

  // ================= 릴 =================
  const LOOPS = 40;
  const reels = [0, 1].map(i => {
    const el = $('reel' + i), strip = el.querySelector('.strip');
    let html = '';
    for (let l = 0; l < LOOPS; l++) for (let d = 0; d < 10; d++) html += `<div>${d}</div>`;
    strip.innerHTML = html;
    return { el, page: $('page' + i), strip, digit: 0 };
  });
  const cellH = () => reels[0].strip.firstElementChild.offsetHeight; // 3D 기울기 영향 없는 실제 높이
  function setReel(r, digit) {
    r.digit = digit;
    r.strip.getAnimations().forEach(a => a.cancel());
    r.strip.style.transform = `translateY(${-digit * cellH()}px)`;
  }
  // 회전 모션: 빠르게 출발 → 점점 느려지며 숫자가 하나씩 또렷하게 넘어감 → 당첨 숫자에서 "탁" 멈춤
  // (예전 곡선은 마지막 한 칸을 0.5초 넘게 기어가서, 직전 숫자에서 멈춘 것처럼 보였음)
  const V_MAX = 32;   // 최고 속도 (칸/초)
  const V_END = 2.8;  // 멈추기 직전 속도 (칸/초) — 0이 아니어서 기어가지 않고 딱 멈춤
  const P = 3;        // 감속 곡선 (클수록 막판에 오래 천천히)
  const RAMP = .35;   // 출발 가속 시간 (초)
  function spinReel(r, target, duration) {
    const h = cellH(), T = duration / 1000;
    const startIdx = r.digit;
    r.strip.getAnimations().forEach(a => a.cancel());
    r.el.classList.remove('done'); r.page.classList.remove('done');

    // 속도 모양 s(t) = 가속 × (A + (1 - t/T)^P), 누적 거리 표를 미리 계산
    const A = V_END / V_MAX, N = 800, cum = new Float64Array(N + 1);
    const s = t => Math.min(1, t / RAMP) * (A + Math.pow(1 - t / T, P));
    for (let i = 1; i <= N; i++) cum[i] = cum[i - 1] + s((i - .5) * T / N) * T / N;
    const I = cum[N];
    // 이동 칸 수: 원하는 거리 이상이면서 정확히 당첨 숫자에 도착하는 값
    let dist = Math.ceil(V_MAX * I);
    while ((startIdx + dist) % 10 !== target) dist++; // 최장 설정(12초×1.2)도 약 140칸 → 띠 길이(400칸) 안
    const endIdx = startIdx + dist, K = dist / I; // K: 실제 속도 배율

    return new Promise(resolve => {
      const t0 = performance.now();
      let last = startIdx;
      const frame = now => {
        const t = Math.min(T, (now - t0) / 1000);
        const x = t / T * N, i = Math.floor(x);
        const d = i >= N ? I : cum[i] + (cum[i + 1] - cum[i]) * (x - i);
        const pos = startIdx + d * K;
        r.strip.style.transform = `translateY(${-pos * h}px)`;
        const idx = Math.round(pos);
        if (idx !== last) { last = idx; tickSound(K * s(t) < 14); } // 느려지면 딸깍 소리 또렷하게
        if (t < T) return requestAnimationFrame(frame);

        // 도착: 당첨 숫자에서 살짝 지나쳤다가 제자리로 "탁"
        r.digit = target;
        sfx('stop');
        r.el.classList.add('done'); r.page.classList.add('done');
        r.strip.animate([
          { transform: `translateY(${-endIdx * h}px)` },
          { transform: `translateY(${-(endIdx + .07) * h}px)`, offset: .35 },
          { transform: `translateY(${-endIdx * h}px)` }
        ], { duration: 260, easing: 'ease-out' }).finished.then(() => { setReel(r, target); resolve(); });
      };
      requestAnimationFrame(frame);
    });
  }
  window.addEventListener('resize', () => reels.forEach(r => setReel(r, r.digit)));

  // ================= 화면 상태 =================
  const btnDraw = $('btnDraw'), btnConfirm = $('btnConfirm'), btnRedraw = $('btnRedraw');
  const status = $('status'), book = $('book');
  let busy = false;

  const btnNext = $('btnNext');
  function show(mode) { // idle | spinning | wait | decide | over
    btnDraw.classList.toggle('hidden', mode === 'decide' || mode === 'wait');
    btnDraw.disabled = mode !== 'idle';
    btnNext.classList.toggle('hidden', mode !== 'wait');
    btnConfirm.classList.toggle('hidden', mode !== 'decide');
    btnRedraw.classList.toggle('hidden', mode !== 'decide');
    book.classList.toggle('win', mode === 'decide');
  }
  function setStatus(txt, big = false) { status.textContent = txt; status.classList.toggle('big', big); }
  function renderHeader() {
    $('title').textContent = S.title || '행운의 페이지';
    document.title = '책읽는 방주 · ' + (S.title || '행운의 페이지');
    $('round').textContent = S.winners.length ? `당첨 ${S.winners.length}명` : '';
  }

  // ================= 추첨 흐름 =================
  // 1단계: [추첨] → 앞자리만 돌고 멈춤  →  2단계: [뒷자리 공개] → 뒷자리 돌고 멈춤  →  확정/재추첨
  const hideDigit = (i, on) => book.classList.toggle('q' + i, on);
  const digitsOf = n => pad(n).split('').map(Number);

  async function draw() {
    if (busy) return;
    const pool = remaining();
    if (!pool.length) { setStatus('모든 번호가 추첨되었습니다'); show('over'); return; }
    busy = true;
    const n = pool[Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32 * pool.length)];
    S.pending = n; S.stage = 1; save();
    const [a] = digitsOf(n);
    hideDigit(0, false); hideDigit(1, true);
    show('spinning');
    setStatus('두근두근… 어떤 페이지가 펼쳐질까요?');
    const ms = reelMs(0);
    startSpinSound(ms);
    await spinReel(reels[0], a, ms);
    stopSpinSound();
    busy = false;
    setStatus(`앞자리 ${a} !`, true);
    show('wait');
  }

  async function revealSecond() {
    if (busy || S.pending == null || S.stage !== 1) return;
    busy = true;
    const n = S.pending, [, b] = digitsOf(n);
    hideDigit(1, false);
    show('spinning');
    setStatus(`앞자리 ${digitsOf(n)[0]} … 뒷자리는?`);
    const ms = reelMs(1);
    startSpinSound(ms);
    await spinReel(reels[1], b, ms);
    stopSpinSound();
    S.stage = 2; save();
    busy = false;
    sfx('win');
    setStatus(`${pad(n)}번 당첨!`, true);
    show('decide');
  }

  function confirmWin() {
    if (S.pending == null) return;
    S.winners.push({ n: S.pending, t: Date.now() });
    const n = S.pending; S.pending = null; S.stage = null; save();
    renderHeader(); renderList();
    setStatus(`🎉 ${pad(n)}번 당첨! 축하합니다 🎉`, true);
    confetti(); sfx('confirm');
    show('idle');
    btnDraw.textContent = '다음 추첨';
  }

  function redraw() {
    if (S.pending == null) return;
    S.redraws.push({ n: S.pending, t: Date.now() });
    S.pending = null; S.stage = null; save();
    renderList();
    show('idle');
    draw();
  }

  btnDraw.onclick = draw;
  btnNext.onclick = revealSecond;
  btnConfirm.onclick = confirmWin;
  btnRedraw.onclick = redraw;

  // ================= 서랍 (보조 기능) =================
  let tab = 'winners';
  const toggleDrawer = force => {
    const open = document.body.classList.toggle('open', force);
    if (open) renderList();
  };
  $('menuBtn').onclick = () => toggleDrawer(true);
  $('closeBtn').onclick = $('drawerBg').onclick = () => toggleDrawer(false);
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    renderList();
  });
  function renderList() {
    $('cntW').textContent = S.winners.length;
    $('cntR').textContent = S.redraws.length;
    $('remain').textContent = remaining().length;
    const arr = S[tab];
    const fmt = t => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    $('list').innerHTML = arr.length
      ? arr.map((x, i) => `<div class="row"><span class="no">${i + 1}</span><span class="num">${pad(x.n)}</span><span class="t">${fmt(x.t)}</span></div>`).join('')
      : `<div class="empty">${tab === 'winners' ? '아직 당첨자가 없습니다' : '재추첨 기록이 없습니다'}</div>`;
  }
  $('titleInput').value = S.title;
  $('titleInput').oninput = e => { S.title = e.target.value; save(); renderHeader(); };
  const showSpin = () => {
    $('spinLabel').textContent = `앞자리 ${reelMs(0) / 1000}초 · 뒷자리 ${reelMs(1) / 1000}초`;
  };
  $('spinRange').value = S.reelSec; showSpin();
  $('spinRange').oninput = e => { S.reelSec = +e.target.value; save(); showSpin(); };
  $('soundChk').checked = S.sound;
  $('soundChk').onchange = e => { S.sound = e.target.checked; save(); if (!S.sound) stopSpinSound(); };
  updateSoundSrc();
  $('copyBtn').onclick = async () => {
    const txt = `[당첨] ${S.winners.map(x => pad(x.n)).join(', ') || '-'}\n[재추첨] ${S.redraws.map(x => pad(x.n)).join(', ') || '-'}`;
    try { await navigator.clipboard.writeText(txt); $('copyBtn').textContent = '복사됨 ✓'; }
    catch { prompt('명단', txt); }
    setTimeout(() => $('copyBtn').textContent = '명단 복사', 1500);
  };
  $('resetBtn').onclick = () => {
    if (!confirm('당첨/재추첨 기록을 모두 지우고 처음부터 시작할까요?')) return;
    if (busy) return;
    const keep = { title: S.title, sound: S.sound, reelSec: S.reelSec };
    S = Object.assign(fresh(), keep); save();
    reels.forEach(r => { setReel(r, 0); r.el.classList.remove('done'); });
    hideDigit(0, true); hideDigit(1, true);
    btnDraw.textContent = '추 첨';
    setStatus('추첨 버튼을 눌러주세요');
    show('idle'); renderHeader(); renderList();
  };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'l' || e.key === 'L' || e.key === 'ㅣ') toggleDrawer();
    else if (e.key === 'Escape') toggleDrawer(false);
    else if (e.code === 'Space' && !document.body.classList.contains('open')) {
      e.preventDefault();
      if (!btnNext.classList.contains('hidden')) revealSecond();
      else if (!btnDraw.classList.contains('hidden') && !btnDraw.disabled) draw();
    }
  });

  // ================= 폭죽 (종이 조각) =================
  const cv = $('fx'), c2 = cv.getContext('2d');
  let parts = [], raf = 0;
  function confetti() {
    cv.width = innerWidth; cv.height = innerHeight;
    const colors = ['#3a6bcf', '#4f4589', '#4560cc', '#ffb703', '#8fb3ff', '#b7a9f2', '#ffffff'];
    for (let i = 0; i < 260; i++) {
      const side = i % 2;
      parts.push({
        x: side ? cv.width + 10 : -10, y: cv.height * (.5 + Math.random() * .4),
        vx: (side ? -1 : 1) * (6 + Math.random() * 12), vy: -(10 + Math.random() * 14),
        s: 7 + Math.random() * 9, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: colors[i % colors.length], life: 0
      });
    }
    if (!raf) tick();
  }
  function tick() {
    c2.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 40 && p.life < 400);
    for (const p of parts) {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      c2.save(); c2.translate(p.x, p.y); c2.rotate(p.r);
      c2.fillStyle = p.c; c2.strokeStyle = 'rgba(0,0,0,.08)';
      c2.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66); c2.strokeRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
      c2.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : (c2.clearRect(0, 0, cv.width, cv.height), 0);
  }

  // ================= 초기화 =================
  renderHeader(); renderList();
  if (S.pending != null && S.stage === 1) { // 앞자리 공개 후 새로고침된 경우 복원
    const [a] = digitsOf(S.pending);
    requestAnimationFrame(() => { setReel(reels[0], a); reels[0].el.classList.add('done'); });
    hideDigit(1, true);
    setStatus(`앞자리 ${a} !`, true);
    show('wait');
  } else if (S.pending != null) { // 결정 대기 중 새로고침된 경우 복원
    const [a, b] = digitsOf(S.pending);
    requestAnimationFrame(() => { setReel(reels[0], a); setReel(reels[1], b); reels.forEach(r => r.el.classList.add('done')); });
    setStatus(`${pad(S.pending)}번 당첨!`, true);
    show('decide');
  } else {
    requestAnimationFrame(() => reels.forEach(r => setReel(r, 0)));
    hideDigit(0, true); hideDigit(1, true);
    show('idle');
    if (S.winners.length) btnDraw.textContent = '다음 추첨';
    if (!remaining().length) { setStatus('모든 번호가 추첨되었습니다'); btnDraw.disabled = true; }
  }
})();
</script>
</body>
</html>
